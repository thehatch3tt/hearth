<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Tonight's handbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap">
<style>
  /* The Soft garden look, the same as the app (src/lib/theme.ts). */
  :root {
    --bg: #E8EEE4; --card: #FFFFFF; --ink: #1F3B2D; --muted: #4D6B58; --faint: #8AA592; --chip: #E8EEE4;
    --accent: #2F5A43; --alert: #FBE3DD; --alert-text: #8E2414; --call: #D93025; --note: #FCEBDD; --note-text: #7A3A12;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: Nunito, system-ui, sans-serif; -webkit-text-size-adjust: 100%; }
  main { max-width: 560px; margin: 0 auto; padding: max(28px, env(safe-area-inset-top)) 16px 120px; display: flex; flex-direction: column; gap: 14px; }
  h1 { margin: 0; font-size: 30px; font-weight: 900; line-height: 1.15; }
  h2 { margin: 0 0 4px; font-size: 18px; font-weight: 900; }
  .meta { font-size: 13px; font-weight: 700; color: var(--muted); }
  .card { background: var(--card); border-radius: 24px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .label { font-size: 12px; font-weight: 800; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); }
  .note { background: var(--note); }
  .note .label { color: var(--note-text); }
  .warn { background: var(--alert); }
  .warn .title { color: var(--alert-text); font-weight: 900; font-size: 16px; }
  .warn .details { color: #6B2416; font-size: 14px; line-height: 1.45; }
  .row { display: flex; gap: 12px; align-items: baseline; padding: 8px 0; border-top: 1px solid var(--chip); }
  .row:first-of-type { border-top: none; }
  .time { width: 64px; flex-shrink: 0; font-size: 13px; font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
  .what { flex: 1; font-size: 15px; font-weight: 700; line-height: 1.35; }
  .what .extra { color: var(--muted); font-weight: 600; }
  .tag { font-size: 12px; font-weight: 800; padding: 3px 8px; border-radius: 8px; white-space: nowrap; }
  .person-head { display: flex; align-items: center; gap: 12px; }
  .avatar { width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 19px; flex-shrink: 0; }
  .name { font-size: 18px; font-weight: 900; }
  .sub { font-size: 14px; font-weight: 600; color: var(--muted); }
  .pill { display: inline-block; background: var(--chip); border-radius: 10px; padding: 6px 10px; font-size: 14px; margin: 0 6px 6px 0; }
  .secret { background: var(--bg); border: none; border-radius: 12px; padding: 10px 12px; width: 100%; display: flex; justify-content: space-between; align-items: center; font: inherit; color: var(--ink); cursor: pointer; text-align: left; }
  .secret .dots { letter-spacing: 3px; font-weight: 800; color: var(--muted); font-size: 17px; }
  .secret .show { font-size: 13px; font-weight: 800; color: var(--accent); }
  .call { display: flex; align-items: center; justify-content: center; gap: 10px; height: 64px; border-radius: 22px; background: var(--call); color: #fff; font-size: 22px; font-weight: 900; text-decoration: none; }
  .contacts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .contact { background: var(--bg); border-radius: 16px; padding: 12px; text-decoration: none; color: var(--ink); display: flex; flex-direction: column; gap: 2px; }
  .contact span:first-child { font-size: 12px; font-weight: 800; color: var(--muted); }
  .contact span:last-child { font-size: 15px; font-weight: 900; font-variant-numeric: tabular-nums; }
  .address { font-size: 21px; font-weight: 900; line-height: 1.3; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px max(16px, env(safe-area-inset-bottom)); background: linear-gradient(to top, var(--bg) 70%, rgba(232, 238, 228, 0)); }
  .bar a { max-width: 528px; margin: 0 auto; display: flex; align-items: center; justify-content: center; height: 54px; border-radius: 27px; background: var(--alert); color: var(--alert-text); font-size: 16px; font-weight: 900; text-decoration: none; }
  .message { text-align: center; padding: 80px 24px; display: flex; flex-direction: column; gap: 10px; }
  .message p { margin: 0; font-size: 16px; font-weight: 600; color: var(--muted); line-height: 1.5; }
  a:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<main id="page"><div class="message"><p>Opening the handbook…</p></div></main>
<script>
  // Fill these in from the Firebase console (Project settings > General > Web app). Not secret.
  const FIREBASE = { projectId: 'YOUR_PROJECT_ID', apiKey: 'YOUR_WEB_API_KEY' };

  const page = document.getElementById('page');

  /** Makes an element. Text is always set as text, never as HTML, so nothing in the handbook can run. */
  function el(tag, props, ...children) {
    const node = document.createElement(tag);
    for (const [key, value] of Object.entries(props || {})) {
      if (key === 'style') Object.assign(node.style, value);
      else if (key.startsWith('on')) node.addEventListener(key.slice(2), value);
      else node.setAttribute(key, value);
    }
    for (const child of children.flat()) {
      if (child === null || child === undefined || child === false || child === '') continue;
      node.append(typeof child === 'string' ? document.createTextNode(child) : child);
    }
    return node;
  }

  function show(...nodes) {
    page.replaceChildren(...nodes);
  }

  function message(title, text) {
    show(el('div', { class: 'message' }, el('h1', {}, title), el('p', {}, text)));
  }

  const fromBase64 = (text) => Uint8Array.from(atob(text.replace(/-/g, '+').replace(/_/g, '/')), (c) => c.charCodeAt(0));

  /** "14:00" → "2:00 pm" */
  function formatTime(time) {
    const [h, m] = time.split(':').map(Number);
    if (Number.isNaN(h)) return time;
    return `${h % 12 === 0 ? 12 : h % 12}:${String(m).padStart(2, '0')} ${h < 12 ? 'am' : 'pm'}`;
  }

  function formatWhen(ms) {
    const date = new Date(ms);
    const day = date.toLocaleDateString('en-US', { weekday: 'long' });
    return `${day} ${date.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }).toLowerCase()}`;
  }

  async function open() {
    const [id, key] = location.hash.slice(1).split('.');
    if (!id || !key) {
      return message('This link isn’t complete', 'Ask the family to send it again, and open the whole link.');
    }
    const url = `https://firestore.googleapis.com/v1/projects/${FIREBASE.projectId}/databases/(default)/documents/links/${encodeURIComponent(id)}?key=${FIREBASE.apiKey}`;
    let response;
    try {
      response = await fetch(url, { cache: 'no-store', referrerPolicy: 'no-referrer' });
    } catch {
      return message('Can’t reach the handbook', 'Check the internet connection and try again.');
    }
    if (response.status === 404) {
      return message('This link has ended', 'The family stopped it, or it ran out. Ask them for a new one.');
    }
    if (!response.ok) return message('Something went wrong', 'Try again in a minute.');

    const fields = (await response.json()).fields;
    if (Date.now() > Date.parse(fields.expiresAt.timestampValue)) {
      return message('This link has ended', 'It ran out. Ask the family for a new one.');
    }
    try {
      const cryptoKey = await crypto.subtle.importKey('raw', fromBase64(key), 'AES-GCM', false, ['decrypt']);
      const plain = await crypto.subtle.decrypt(
        { name: 'AES-GCM', iv: fromBase64(fields.iv.stringValue) },
        cryptoKey,
        fromBase64(fields.data.stringValue),
      );
      render(JSON.parse(new TextDecoder().decode(plain)));
    } catch {
      message('This link can’t be opened', 'Part of it may be missing. Ask the family to send it again.');
    }
  }

  function render(s) {
    const nodes = [];
    const by = s.from || (s.family ? `the ${s.family}s` : 'the family');
    document.title = s.family ? `${s.family} Family Handbook` : 'Tonight’s handbook';

    nodes.push(
      el('div', { style: { display: 'flex', flexDirection: 'column', gap: '4px' } },
        el('div', { class: 'meta' }, `Shared by ${by} · works until ${formatWhen(s.expiresAt)}`),
        el('h1', {}, s.to ? `Hi ${s.to}, thanks for tonight!` : document.title),
      ),
    );

    if (s.note) {
      nodes.push(el('div', { class: 'card note' }, el('div', { class: 'label' }, s.from ? `Tonight’s note from ${s.from}` : 'Tonight’s note'), el('div', { style: { fontSize: '15px', lineHeight: '1.5' } }, s.note)));
    }

    // Allergies and warnings first: the thing a helper most needs to know.
    for (const person of s.people) {
      for (const alert of person.alerts) {
        nodes.push(el('div', { class: 'card warn' }, el('div', { class: 'title' }, `${person.name}: ${alert.title}`), alert.details && el('div', { class: 'details' }, alert.details)));
      }
    }

    // Everyone's timed routine steps and medicines, in one list for the evening.
    const plan = [];
    for (const person of s.people) {
      for (const routine of person.routines) {
        for (const step of routine.steps) plan.push({ person, time: step.time, text: step.text, extra: step.note });
      }
      for (const med of person.medicines) {
        if (med.time) plan.push({ person, time: med.time, text: `Medicine: ${med.name}`, extra: med.note });
      }
    }
    plan.sort((a, b) => (a.time || '99').localeCompare(b.time || '99'));
    if (plan.length) {
      nodes.push(el('div', { class: 'card' },
        el('h2', {}, 'The plan'),
        plan.map((item) => el('div', { class: 'row' },
          el('span', { class: 'time' }, item.time ? formatTime(item.time) : ''),
          el('span', { class: 'what' }, item.text, item.extra && el('span', { class: 'extra' }, ` · ${item.extra}`)),
          s.people.length > 1 && el('span', { class: 'tag', style: { background: item.person.colors.tint, color: item.person.colors.strong } }, item.person.name),
        )),
      ));
    }

    for (const person of s.people) {
      const asNeeded = person.medicines.filter((m) => !m.time);
      const sub = [person.age && (person.kind === 'child' && /^\d+$/.test(person.age) ? `${person.age} years old` : person.age), person.about].filter(Boolean).join(' · ');
      nodes.push(el('div', { class: 'card' },
        el('div', { class: 'person-head' },
          el('div', { class: 'avatar', style: { background: person.colors.soft, color: person.colors.strong } }, (person.name.trim()[0] || '?').toUpperCase()),
          el('div', {}, el('div', { class: 'name' }, person.name), sub && el('div', { class: 'sub' }, sub)),
        ),
        asNeeded.length > 0 && el('div', {}, el('div', { class: 'label' }, 'Medicine if needed'), asNeeded.map((m) => el('div', { class: 'what' }, m.name, m.note && el('span', { class: 'extra' }, ` · ${m.note}`)))),
        person.notes.map((n) => el('div', {}, n.label && el('div', { class: 'label' }, n.label), el('div', { style: { fontSize: '15px', lineHeight: '1.45' } }, n.text))),
        person.words.length > 0 && el('div', {},
          el('div', { class: 'label', style: { marginBottom: '6px' } }, person.kind === 'child' ? 'Words they use' : 'Good to know'),
          person.words.map((w) => el('span', { class: 'pill' }, el('b', {}, `“${w.word}”`), w.meaning ? ` = ${w.meaning}` : '')),
        ),
      ));
    }

    if (s.house && s.house.length) {
      nodes.push(el('div', { class: 'card' },
        el('h2', {}, 'Around the house'),
        s.house.map((item) => el('div', { class: 'row', style: { flexDirection: 'column', gap: '4px', alignItems: 'stretch' } },
          el('div', { style: { fontWeight: '900', fontSize: '15px' } }, item.label),
          item.value && el('div', { class: 'sub' }, item.value),
          item.secret && secretButton(item),
        )),
      ));
    }

    if (s.emergency) {
      const e = s.emergency;
      nodes.push(el('div', { class: 'card', id: 'emergency' },
        el('h2', {}, 'Emergency'),
        el('a', { class: 'call', href: 'tel:911' }, 'Call 911'),
        e.address && el('div', {}, el('div', { class: 'label' }, 'Read this to the operator'), el('div', { class: 'address' }, e.address), e.addressNote && el('div', { class: 'sub' }, e.addressNote)),
        e.contacts.length > 0 && el('div', { class: 'contacts' }, e.contacts.map((c) => el('a', { class: 'contact', href: `tel:${c.phone.replace(/[^\d+]/g, '')}` }, el('span', {}, [c.label, c.name].filter(Boolean).join(' · ') || 'Call'), el('span', {}, c.phone)))),
        e.note && el('div', { class: 'sub' }, e.note),
      ));
    }

    show(...nodes);
    if (s.emergency) {
      document.body.append(el('div', { class: 'bar' }, el('a', { href: '#', onclick: (event) => { event.preventDefault(); document.getElementById('emergency').scrollIntoView({ behavior: 'smooth' }); } }, 'Emergency')));
    }
  }

  /** A password or code as dots until tapped. */
  function secretButton(item) {
    const name = /wi-?fi|password/i.test(item.label) ? 'password' : 'code';
    const value = el('span', { class: 'dots' }, '••••••••');
    const action = el('span', { class: 'show' }, 'Show');
    let shown = false;
    const button = el('button', { class: 'secret', type: 'button', 'aria-label': `Show ${name}` }, value, action);
    button.addEventListener('click', () => {
      shown = !shown;
      value.textContent = shown ? item.secret : '••••••••';
      value.className = shown ? '' : 'dots';
      value.style.fontWeight = '900';
      action.textContent = shown ? 'Hide' : 'Show';
      button.setAttribute('aria-label', `${shown ? 'Hide' : 'Show'} ${name}`);
    });
    return button;
  }

  open();
</script>
</body>
</html>
